<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bed-Stuy 2125</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Fraunces:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="page-gallery">
    <header class="site-header container">
        <a href="index.html" class="wordmark">BED-STUY 2125</a>
        <nav class="pill-nav">
            <a href="index.html" class="pill-link">Home</a>
            <a href="about.html" class="pill-link">About</a>
            <a href="gallery.html" class="pill-link is-active">Gallery</a>
        </nav>
    </header>

    <div class="container section">
        <h1 class="display-heading">
            <span class="line-1" id="heading-line-1">Neighborhood</span>
            <span class="line-2" id="heading-line-2">Gallery</span>
        </h1>

        <nav class="filter-pills" aria-label="Filter the gallery">
            <a class="filter-pill" data-filter="all" href="gallery.html">All</a>
            <a class="filter-pill" data-filter="community" href="gallery.html?collection=community">Community builds</a>
            <a class="filter-pill" data-filter="initial" href="gallery.html?collection=initial">Initial renderings</a>
            <a class="filter-pill" data-filter="sites" href="gallery.html?collection=sites">Sites</a>
        </nav>
        <nav class="filter-pills filter-pills--sites" id="site-pills" aria-label="Choose a site" hidden></nav>

        <p class="site-cta" id="site-cta" hidden>
            <a class="btn-secondary" id="site-cta-link" href="#">Add your rendering for this site →</a>
        </p>

        <p class="gallery-empty" id="gallery-empty" hidden>No renderings here yet. Be the first.</p>
        <div id="buildings-container" class="rendering-grid"></div>
    </div>

    <footer class="site-footer container">
        <span class="wordmark">BED-STUY 2125</span>
        <span>A speculative design project by Jeremy Knight</span>
    </footer>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Rendering preview">
        <button class="lightbox-arrow lightbox-arrow--prev" aria-label="Previous rendering">&larr;</button>
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <div class="lightbox-content">
            <div class="lightbox-frame">
                <img id="lightbox-img" src="" alt="">
            </div>
            <div class="lightbox-caption">
                <span id="lightbox-name" class="card-name"></span>
                <span id="lightbox-number" class="card-number"></span>
                <button type="button" class="lightbox-share" id="lightbox-share">Share</button>
            </div>
        </div>
        <button class="lightbox-arrow lightbox-arrow--next" aria-label="Next rendering">&rarr;</button>
    </div>

    <script src="initial-renderings.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
